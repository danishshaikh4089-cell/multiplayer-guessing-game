<!DOCTYPE html>
<html>

<head>

    <title>🎮 Online Guessing Game</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e293b);
            color: white;
            text-align: center;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: 70px auto;
        }

        .box {
            background: #222;
            padding: 30px;
            margin-top: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px black;
        }

        input {
            width: 80%;
            padding: 13px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
        }

        button {
            padding: 12px 25px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .create {
            background: #22c55e;
            color: white;
        }

        .join {
            background: #3b82f6;
            color: white;
        }

        .room {
            font-size: 30px;
            color: #facc15;
            letter-spacing: 5px;
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🎮 Online Guessing Game</h1>

    <p>👥 Play with your friend</p>

    {% if room_code %}

        <div class="box">

            <h2>🎉 Room Created!</h2>

            <p>🔗 Apne friend ko ye Room Code do:</p>

            <div class="room">
                {{ room_code }}
            </div>

            <p>👤 Player: {{ player_name }}</p>

            <div class="message">
                {{ message }}
            </div>

        </div>

    {% else %}

        <div class="box">

            <h2>🟢 Create Game</h2>

            <form method="POST">

                <input
                    type="text"
                    name="player_name"
                    placeholder="Apna naam"
                    required
                >

                <br>

                <button class="create" type="submit">
                    🎮 Create Room
                </button>

            </form>

        </div>


        <div class="box">

            <h2>🔵 Join Game</h2>

            <form action="/join" method="POST">

                <input
                    type="text"
                    name="player_name"
                    placeholder="Apna naam"
                    required
                >

                <input
                    type="text"
                    name="room_code"
                    placeholder="Room Code"
                    required
                >

                <br>

                <button class="join" type="submit">
                    🚀 Join Room
                </button>

            </form>

        </div>

    {% endif %}


    {% if message and not room_code %}

        <div class="message">
            {{ message }}
        </div>

    {% endif %}

</div>

</body>

</html>
